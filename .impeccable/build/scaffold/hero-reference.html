<!doctype html>
<html lang="en">
<head>
  <meta charset="utf-8">
  <title>Scaffold reference: ade-sala-evidencia-agents-b.png</title>
  <link rel="stylesheet" href="https://fonts.googleapis.com/css2?family=Chathura:wght@300&display=swap">
  <link rel="stylesheet" href="layout.css">
  <style>html,body{margin:0}body{background:#f7f7f8}.region{box-sizing:border-box}.region.text p{white-space:pre-wrap}</style>
</head>
<body>
<!-- Reference only. Every region sits at its measured box inside a comp-aspect frame. Take the boxes (layout.css), keep your own semantic structure. -->
<main class="comp-frame" style="max-width:1587px">
  <div class="r-window-chrome region chrome" data-region="window-chrome"><!-- macOS title and project context toolbar --></div>
  <div class="r-primary-navigation region chrome" data-region="primary-navigation"><!-- labeled application navigation with Agents active --></div>
  <div class="r-explorer region chrome" data-region="explorer"><!-- compact project file explorer --></div>
  <div class="r-status-bar region chrome" data-region="status-bar"><!-- bottom project and repository status --></div>
  <div class="r-project-context region control" data-region="project-context"><!-- Project and branch selectors: rebuild the control's chrome from the crop (comp-spec.mjs --crop project-context); its ink box, border, fill, radius, and label size are the comp's --></div>
  <div class="r-global-actions region control" data-region="global-actions"><!-- share, notifications and account actions: rebuild the control's chrome from the crop (comp-spec.mjs --crop global-actions); its ink box, border, fill, radius, and label size are the comp's --></div>
  <div class="r-sessions-header region chrome" data-region="sessions-header"><!-- sessions label and new-session action --></div>
  <div class="r-session-list region chrome" data-region="session-list"><!-- followed, recent and other agent sessions --></div>
  <div class="r-session-tabs region chrome" data-region="session-tabs"><!-- active session and adjacent session tabs --></div>
  <div class="r-conversation-user-turn region text" data-region="conversation-user-turn"><!-- user intent message with timestamp --><p style="font-size:var(--r-conversation-user-turn-font);line-height:1.05;margin:0">conversation-user-turn</p></div>
  <div class="r-conversation-agent-turn region text" data-region="conversation-agent-turn"><!-- agent response with provider identity --><p style="font-size:var(--r-conversation-agent-turn-font);font-family:var(--r-conversation-agent-turn-family),sans-serif;font-weight:var(--r-conversation-agent-turn-weight);line-height:1.05;margin:0">conversation-agent-turn</p></div>
  <div class="r-tool-evidence region control" data-region="tool-evidence"><!-- collapsible completed-tool evidence row: rebuild the control's chrome from the crop (comp-spec.mjs --crop tool-evidence); its ink box, border, fill, radius, and label size are the comp's --></div>
  <div class="r-changed-files-evidence region control" data-region="changed-files-evidence"><!-- changed files list with additions and deletions: rebuild the control's chrome from the crop (comp-spec.mjs --crop changed-files-evidence); its ink box, border, fill, radius, and label size are the comp's --></div>
  <div class="r-inline-diff region text" data-region="inline-diff"><!-- temporary readable inline code diff --><p style="font-size:var(--r-inline-diff-font);line-height:1.05;margin:0">inline-diff</p></div>
  <div class="r-completion-turn region text" data-region="completion-turn"><!-- agent completion and test evidence --><p style="line-height:1.05;margin:0">completion-turn</p></div>
  <div class="r-composer region control" data-region="composer"><!-- message composer, permissions and send action: rebuild the control's chrome from the crop (comp-spec.mjs --crop composer); its ink box, border, fill, radius, and label size are the comp's --></div>
  <div class="r-terminal-tabs region chrome" data-region="terminal-tabs"><!-- persistent native terminal dock header and tabs --></div>
  <div class="r-terminal-transcript region text" data-region="terminal-transcript"><!-- minimal native terminal transcript --><p style="font-size:var(--r-terminal-transcript-font);line-height:1.05;margin:0">terminal-transcript</p></div>
</main>
</body>
</html>
