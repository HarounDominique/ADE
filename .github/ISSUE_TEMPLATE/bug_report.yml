name: Bug report
description: Report a reproducible problem in ADE/Assay
title: "[Bug]: "
labels: [bug]
body:
  - type: markdown
    attributes:
      value: Please remove private data and credentials before submitting.
  - type: textarea
    id: summary
    attributes:
      label: What happened?
      description: Describe the observed behavior and the expected behavior.
    validations:
      required: true
  - type: textarea
    id: reproduce
    attributes:
      label: Reproduction steps
      description: Give the smallest reliable set of steps.
    validations:
      required: true
  - type: input
    id: version
    attributes:
      label: Version and platform
      placeholder: Assay 0.3.0, macOS 15 / Ubuntu 24.04 / Windows 11
    validations:
      required: true
  - type: textarea
    id: logs
    attributes:
      label: Logs or evidence
      description: Paste sanitized logs, test output or screenshots.
